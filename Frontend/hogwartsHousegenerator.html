<!--Hogwarts House generator -->
<!doctype html>
<html lang="en">
  <head>
    <title>Hogwarts House generator</title>
    <link rel="stylesheet" href="hogwartsHousegenerator.css" />
    <script src="hogwartsHousegenerator.js" defer></script>
  </head>
  <body>
    <h3>Hogwarts House generator</h3>
    <input id="name" placeholder="Enter your name" required />
    <button id="submit">Submit!</button>
    <br />
    <button id="house">Press Here to get a random house!</button>
    <h3 id="houseFeedback">House feedback!</h3>
    <p>
      Are you happy with the House?
      <br />
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </p>
  </body>
</html>
